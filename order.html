<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | Crème & Charm Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>
            <h1>Crème & Charm Bakery</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="order.html">Order</a></li>
            </ul>
        </nav>
    </header>

    <!-- Order Form -->
    <section class="order">

        <h2>Place Your Order</h2>

        <form>

            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="product">Select Product</label>

            <select id="product">
                <option>Birthday Cake</option>
                <option>Wedding Cake</option>
                <option>Meat Pie</option>
                <option>Fish Roll</option>
                <option>Chin Chin</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" value="1">

            <label for="message">Special Instructions</label>

            <textarea id="message" rows="5" placeholder="Tell us more about your order..."></textarea>

            <button type="submit" class="btn">Submit Order</button>

        </form>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Crème & Charm Bakery. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
